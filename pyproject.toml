[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solvsel"
version = "0.2.0"
description = "Rank crystallization solvents for an API from its SMILES"
requires-python = ">=3.10"
dependencies = ["rdkit>=2023.9", "pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "lightgbm>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "openpyxl"]
fastsolv = ["fastsolv"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
